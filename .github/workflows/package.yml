name: Canonical package proof
on:
  workflow_call:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      SCW_PYTHON_WHEEL_PROOF: '1'
      UV_NO_CONFIG: '1'
      UV_PYTHON_DOWNLOADS: never
      UV_CACHE_DIR: ${{ runner.temp }}/scw-uv-cache
      CARGO_NET_OFFLINE: 'true'
      CARGO_TARGET_DIR: ${{ runner.temp }}/scw-cargo-target
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/vscode-extension/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.24'
          enable-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'
      - uses: dtolnay/rust-toolchain@stable
      # Cache is an optimization, never a prerequisite for a cold runner.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: scw-ci-cargo-ubuntu24-v2-${{ hashFiles('apps/vscode-extension/assets/templates/**/rust/**/Cargo.toml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: scw-ci-cargo-ubuntu24-v2-
      - name: Install locked extension tooling (network; no lifecycle scripts)
        run: npm ci --ignore-scripts --prefix apps/vscode-extension
      - name: Prewarm declared Rust build/test dependencies (CI network bootstrap only)
        env:
          CARGO_NET_OFFLINE: 'false'
        run: python3 apps/vscode-extension/scripts/ci/bootstrap-rust.py
      - name: Prewarm isolated Python build/test tooling (network only here)
        run: |
          uv venv --no-project --python python3 "$RUNNER_TEMP/scw-tools"
          uv pip install --python "$RUNNER_TEMP/scw-tools/bin/python" 'hatchling>=1.27,<2' 'pytest>=8,<10'
          echo "$RUNNER_TEMP/scw-tools/bin" >> "$GITHUB_PATH"
          uv pip freeze --python "$RUNNER_TEMP/scw-tools/bin/python"
      - name: Canonical typecheck/build/scoped tests/package/verify (offline proofs)
        env:
          UV_OFFLINE: '1'
          CANDIDATE: ${{ runner.temp }}/scw-package-${{ github.run_id }}-${{ github.run_attempt }}.vsix
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/scw-proof"
          node --version; python3 --version; uv --version; bun --version; rustc --version
          cd apps/vscode-extension
          npm run check
          npm run package -- --out "$CANDIDATE" 2>&1 | tee "$RUNNER_TEMP/scw-proof/package.log"
          if grep -Eq 'BLOCKED:.*(offline|cached|python3|tooling)' "$RUNNER_TEMP/scw-proof/package.log"; then exit 1; fi
          cp -f "$CANDIDATE" "$RUNNER_TEMP/scw-proof/scaleway-ai-toolkit-preview.vsix"
          cd "$RUNNER_TEMP/scw-proof"
          sha256sum scaleway-ai-toolkit-preview.vsix > scaleway-ai-toolkit-preview.vsix.sha256
      - name: Upload verified candidate (not a release)
        if: github.event_name == 'workflow_dispatch' && github.repository == 'bioinfornatics/scaleway-ai-toolkit-vscode' && vars.PUBLIC_RELEASE_APPROVED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vsix-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scw-proof/
          if-no-files-found: error
          retention-days: 7
      - name: Report proof limits
        if: always()
        run: |
          echo 'Scoped selection only; historical stopped suites NOT RUN. Only optional Actix inventories may skip twice if Cargo cache is incomplete; mandatory clap/axum caches are bootstrapped explicitly in CI. Runtime dependencies, inference, installed VS Code minimum-host and public rights NOT validated. No registry publication.' >> "$GITHUB_STEP_SUMMARY"
